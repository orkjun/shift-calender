<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>교대달력_일정관리</title>

    <!-- 크롬 PWA 정식 인라인 Manifest -->
    <script id="manifest-placeholder" type="application/json">
    {
        "short_name": "교대달력",
        "name": "교대달력_일정관리",
        "icons": [
            {
                "src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%232563eb'><rect width='512' height='512' rx='100' fill='%230f172a'/><text x='50%' y='55%' font-size='220' font-weight='bold' fill='%2338bdf8' text-anchor='middle' dominant-baseline='middle'>교대</text></svg>",
                "sizes": "192x192 512x512",
                "type": "image/svg+xml",
                "purpose": "any maskable"
            }
        ],
        "start_url": "./",
        "background_color": "#0f172a",
        "theme_color": "#0f172a",
        "display": "standalone",
        "orientation": "portrait"
    }
    </script>
    <script>
        const manifestBlob = new Blob([document.getElementById('manifest-placeholder').textContent], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            --color-day: rgba(254, 243, 199, 0.75);
            --color-night: rgba(224, 242, 254, 0.75);
            --color-off: rgba(254, 226, 226, 0.75);

            --color-work-day: rgba(245, 158, 11, 0.85);   /* 주간대근 */
            --color-work-night: rgba(37, 99, 235, 0.85);  /* 야간대근 */
            --color-leave: rgba(239, 68, 68, 0.85);       /* 휴가 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 100dvh;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .header {
            position: relative;
            text-align: center;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.15rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .header .subtitle {
            font-size: 0.78rem;
            color: #2563eb;
            font-weight: 700;
            margin-top: 2px;
            cursor: pointer;
            display: inline-block;
            padding: 2px 10px;
            background: #eff6ff;
            border-radius: 12px;
            border: 1px solid #bfdbfe;
        }

        .install-btn {
            position: absolute;
            right: 0;
            top: 2px;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* 급여 카드 */
        .salary-card {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            cursor: pointer;
        }

        .salary-card:active {
            transform: scale(0.98);
        }

        .salary-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 3px;
        }

        .salary-period {
            color: #38bdf8;
            font-weight: 700;
            cursor: pointer;
        }

        .salary-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .salary-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .salary-item:not(:last-child) {
            border-right: 1px solid rgba(255,255,255,0.15);
        }

        .salary-label {
            font-size: 0.63rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .salary-value {
            font-size: 0.82rem;
            font-weight: 800;
            margin-top: 1px;
            color: #38bdf8;
        }

        .salary-value.paycheck {
            color: #4ade80;
            font-size: 0.9rem;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .month-nav h2 {
            font-size: 1rem;
            font-weight: 700;
        }

        .nav-btn {
            background: #f1f5f9;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto repeat(6, 1fr);
            gap: 3px;
            flex: 1;
            height: 100%;
        }

        .weekday {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 0;
            color: var(--text-muted);
        }

        .weekday:first-child { color: #ef4444; }
        .weekday:last-child { color: #3b82f6; }

        .day-cell {
            border-radius: 6px;
            padding: 2px 1px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        .day-cell.other-month { opacity: 0.25; }
        .day-cell.today { outline: 2px solid #2563eb; outline-offset: -2px; }

        .shift-D { background-color: var(--color-day); }
        .shift-N { background-color: var(--color-night); }
        .shift-OFF { background-color: var(--color-off); }

        .cell-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 2px;
        }

        .day-number { font-size: 0.73rem; font-weight: 800; }
        .sun { color: #dc2626; }
        .sat { color: #2563eb; }

        .shift-tag {
            font-size: 0.53rem;
            font-weight: 800;
            padding: 0 2px;
            border-radius: 3px;
            background: rgba(255,255,255,0.7);
        }

        .status-badge {
            font-size: 0.53rem;
            font-weight: 800;
            padding: 1px 2px;
            border-radius: 3px;
            text-align: center;
            margin-top: 1px;
            color: #fff;
            background: rgba(0,0,0,0.6);
        }

        .cell-memo {
            font-size: 9.5px;
            line-height: 1.12;
            letter-spacing: -1px;
            color: #0f172a;
            font-weight: 700;
            margin-top: 1px;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: pre-wrap;
            width: 100%;
        }

        /* 팝업 모달 공통 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #fff;
            width: 90%;
            max-width: 380px;
            max-height: 85vh;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .team-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .team-btn {
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: #f8fafc;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .team-btn.selected {
            border-color: #2563eb;
            background: #eff6ff;
            color: #2563eb;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .opt-btn {
            padding: 5px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .opt-btn.active {
            background: #1e293b;
            color: #fff;
            border-color: #1e293b;
        }

        .color-picker {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-circle.selected {
            border-color: #000;
            transform: scale(1.15);
        }

        textarea {
            width: 100%;
            height: 60px;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: none;
            font-size: 0.8rem;
        }

        .modal-footer-btns {
            display: flex;
            gap: 8px;
        }

        .delete-btn {
            flex: 1;
            background: #ef4444;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-btn {
            flex: 2;
            background: #2563eb;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .confirm-btn {
            width: 100%;
            background: #2563eb;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
        }

        .salary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }

        .salary-table th, .salary-table td {
            border: 1px solid var(--border-color);
            padding: 5px 8px;
            text-align: left;
        }

        .salary-table th {
            background: #f1f5f9;
            font-weight: 700;
        }

        .salary-table td.num {
            text-align: right;
            font-family: monospace;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: #2563eb;
            margin-top: 8px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>교대달력_일정관리</h1>
        <div class="subtitle" id="teamSubtitle" onclick="openTeamModal()">C조 교대달력 ▾</div>
        <button class="install-btn" id="installBtn" onclick="installApp()">📲 설치</button>
    </div>

    <!-- 급여 요약 카드 -->
    <div class="salary-card" onclick="openSalaryDetailModal()">
        <div class="salary-info-bar">
            <span id="salaryPeriodText">정산기간: 로딩중...</span>
            <span class="salary-period" onclick="event.stopPropagation(); openPeriodModal()">정산일 설정 ⚙️</span>
        </div>
        <div class="salary-main">
            <div class="salary-item">
                <span class="salary-label">총 급여 (지급)</span>
                <span class="salary-value" id="totalPay">₩0</span>
            </div>
            <div class="salary-item">
                <span class="salary-label">공제 합계</span>
                <span class="salary-value" style="color: #f87171;" id="deductionPay">₩0</span>
            </div>
            <div class="salary-item">
                <span class="salary-label">실 수령액</span>
                <span class="salary-value paycheck" id="netPay">₩0</span>
            </div>
        </div>
    </div>

    <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <h2 id="monthTitle">2026년 10월</h2>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <div class="calendar-grid" id="calendarGrid">
        <div class="weekday">일</div>
        <div class="weekday">월</div>
        <div class="weekday">화</div>
        <div class="weekday">수</div>
        <div class="weekday">목</div>
        <div class="weekday">금</div>
        <div class="weekday">토</div>
    </div>
</div>

<!-- 1. 조 선택 모달 -->
<div class="modal-overlay" id="teamModal">
    <div class="modal-card">
        <div class="modal-header">
            <span>근무조 선택</span>
            <button class="close-btn" onclick="closeTeamModal()">✕</button>
        </div>
        <div class="team-options">
            <button class="team-btn" onclick="selectTeam('A')">A조</button>
            <button class="team-btn" onclick="selectTeam('B')">B조</button>
            <button class="team-btn" onclick="selectTeam('C')">C조</button>
            <button class="team-btn" onclick="selectTeam('D')">D조</button>
        </div>
    </div>
</div>

<!-- 2. 급여 정산일 설정 모달 -->
<div class="modal-overlay" id="periodModal">
    <div class="modal-card" style="max-width: 300px;">
        <div class="modal-header">
            <span id="periodModalTitle">급여 정산일 변경</span>
            <button class="close-btn" onclick="closePeriodModal()">✕</button>
        </div>
        <div class="form-group">
            <label id="periodModalLabel">해당 월 정산 마감일 (기본: 25일)</label>
            <select id="cutoffDaySelect" style="padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.9rem;">
            </select>
        </div>
        <button class="save-btn" onclick="saveCutoffDay()">적용하기</button>
    </div>
</div>

<!-- 3. 급여 상세 명세서 팝업 -->
<div class="modal-overlay" id="salaryDetailModal">
    <div class="modal-card" style="max-width: 420px; max-height: 90vh;">
        <div class="modal-header">
            <span id="salaryDetailTitle">급여 상세 내역 (통상임금2 기준)</span>
            <button class="close-btn" onclick="closeSalaryDetailModal()">✕</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto;" id="salaryDetailContent">
        </div>
        <button class="confirm-btn" onclick="closeSalaryDetailModal()">확인</button>
    </div>
</div>

<!-- 4. 일정/휴가/대근 편집 모달 -->
<div class="modal-overlay" id="editModal">
    <div class="modal-card">
        <div class="modal-header">
            <span id="modalDateTitle">편집</span>
            <button class="close-btn" onclick="closeEditModal()">✕</button>
        </div>

        <div class="form-group">
            <label>휴가 선택</label>
            <div class="btn-group" id="leaveGroup">
                <button class="opt-btn" onclick="toggleOption('leave', '하휴')">하휴</button>
                <button class="opt-btn" onclick="toggleOption('leave', '년차')">년차</button>
                <button class="opt-btn" onclick="toggleOption('leave', '지정')">지정</button>
                <button class="opt-btn" onclick="toggleOption('leave', '건강유결')">건강유결</button>
            </div>
        </div>

        <div class="form-group">
            <label>대근 선택</label>
            <div class="btn-group" id="workGroup">
                <button class="opt-btn" onclick="toggleOption('work', '주간대근')">주간대근</button>
                <button class="opt-btn" onclick="toggleOption('work', '야간대근')">야간대근</button>
            </div>
        </div>

        <div class="form-group">
            <label>특별한 날 강조색 (불투명 고대비 5종)</label>
            <div class="color-picker">
                <div class="color-circle" style="background: #ffffff; border: 1px solid #ccc;" onclick="selectColor('')" title="기본"></div>
                <div class="color-circle" style="background: #FF2D55;" onclick="selectColor('#FF2D55')" title="형광레드"></div>
                <div class="color-circle" style="background: #FF9500;" onclick="selectColor('#FF9500')" title="골드옐로우"></div>
                <div class="color-circle" style="background: #32D74B;" onclick="selectColor('#32D74B')" title="네온라임"></div>
                <div class="color-circle" style="background: #5AC8FA;" onclick="selectColor('#5AC8FA')" title="스카이블루"></div>
                <div class="color-circle" style="background: #FF375F;" onclick="selectColor('#FF375F')" title="핫핑크"></div>
            </div>
        </div>

        <div class="form-group">
            <label>메모 (최대 10글자 x 4줄)</label>
            <textarea id="memoInput" placeholder="메모를 입력하세요"></textarea>
        </div>

        <div class="modal-footer-btns">
            <button class="delete-btn" onclick="deleteEvent()">삭제하기</button>
            <button class="save-btn" onclick="saveEvent()">저장하기</button>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => self.clients.claim());
            self.addEventListener('fetch', (e) => self.respondWith(fetch(e.request).catch(() => new Response(''))));
        `;
        const blob = new Blob([swCode], {type: 'text/javascript'});
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(()=>{});
    }

    // ===== 통상시급2 기준: 19,685원 =====
    const HOURLY_RATE = 19685; 
    
    // 고정 지급 항목
    const FIXED_EARNINGS = {
        '기본급': 1939560,
        '직능급': 809560, 
        '식대': 140000, 
        '정기상여': 962192,
        '성과금': 1786928, 
        '근속수당': 55000, 
        '교대수당': 164947,
        '환경기능수당': 48000, 
        '냉연포장수당': 100000, 
        '업무몰입수당': 247421,
        '자기개발비': 150000, 
        '연장근무수당(고정8h)': 236215
    };
    const FIXED_PAY_SUM = Object.values(FIXED_EARNINGS).reduce((a, b) => a + b, 0);

    // 요청하신 국민연금, 건강보험, 고용보험 금액 및 대출/기타 고정 항목 반영
    const FIXED_DEDUCTIONS = {
        '국민연금': 313020, 
        '건강보험': 346420, 
        '고용보험': 76760,
        '대출원금': 166667,
        '대출이자': 8739, 
        '경조금나눔공제': 5000
    };
    const FIXED_DEDUCTION_BASE = Object.values(FIXED_DEDUCTIONS).reduce((a, b) => a + b, 0);

    // ===== 4조 2교대 정밀 연산 및 조별 정확한 오프셋 적용 =====
    const BASE_DATE = new Date(2026, 9, 21); // 2026-10-21 기준일
    const PATTERN = ['OFF', 'OFF', 'D', 'D', 'OFF', 'OFF', 'N', 'N'];
    
    const TEAM_OFFSETS = {
        'C': 1, // OFF (야간 후 휴일 2일차)
        'D': 3, // D (주간근무 2일차)
        'B': 5, // OFF (주간 후 휴일 2일차)
        'A': 7  // N (야간근무 2일차)
    };

    let currentTeam = localStorage.getItem('shift_team') || 'C';
    let currentDate = new Date(2026, 9, 21);
    let selectedDateKey = '';
    let eventsData = JSON.parse(localStorage.getItem('shift_events') || '{}');
    let cutoffDaysMap = JSON.parse(localStorage.getItem('shift_cutoff_map') || '{}');

    let tempLeave = '';
    let tempWork = '';
    let tempColor = '';
    let deferredPrompt = null;

    let lastCalculatedData = { 
        nightHours: 0, holidayHours: 0,
        nightPay: 0, holidayPay: 0, fixedOtPay: 236215,
        totalPay: 0, incomeTax: 0, residentTax: 0, totalDeduction: 0, netPay: 0, periodStr: '' 
    };

    window.onload = function() {
        initCutoffSelect();
        updateTeamDisplay();
        renderCalendar();
    };

    function getMonthKey(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}`;
    }

    function getCutoffDayForDate(date) {
        const key = getMonthKey(date);
        return cutoffDaysMap[key] !== undefined ? cutoffDaysMap[key] : 25;
    }

    function initCutoffSelect() {
        const select = document.getElementById('cutoffDaySelect');
        select.innerHTML = '';
        const currentCutoff = getCutoffDayForDate(currentDate);
        for (let i = 1; i <= 28; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `${i}일`;
            if (i === currentCutoff) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function updateTeamDisplay() {
        document.getElementById('teamSubtitle').innerText = `${currentTeam}조 교대달력 ▾`;
    }

    function getShiftInfo(date, team) {
        const diffDays = Math.floor((date.getTime() - BASE_DATE.getTime()) / (1000 * 3600 * 24));
        const offset = TEAM_OFFSETS[team] !== undefined ? TEAM_OFFSETS[team] : 1;
        let index = (offset + diffDays) % 8;
        if (index < 0) index += 8;
        return PATTERN[index];
    }

    function getSalaryPeriod(targetDate) {
        const currentYear = targetDate.getFullYear();
        const currentMonth = targetDate.getMonth();

        const endCutoff = getCutoffDayForDate(targetDate);
        const lastDayOfCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const endDateDay = Math.min(endCutoff, lastDayOfCurrentMonth);
        const endDate = new Date(currentYear, currentMonth, endDateDay, 0, 0, 0, 0);

        let prevYear = currentYear;
        let prevMonth = currentMonth - 1;
        if (prevMonth < 0) {
            prevMonth = 11;
            prevYear--;
        }
        const prevDateObj = new Date(prevYear, prevMonth, 1);
        const prevCutoff = getCutoffDayForDate(prevDateObj);

        const startDate = new Date(prevYear, prevMonth, prevCutoff + 1, 0, 0, 0, 0);

        return { startDate, endDate };
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        document.getElementById('monthTitle').innerText = `${year}년 ${month + 1}월`;

        const period = getSalaryPeriod(currentDate);
        const pStartStr = `${period.startDate.getMonth()+1}/${period.startDate.getDate()}`;
        const pEndStr = `${period.endDate.getMonth()+1}/${period.endDate.getDate()}`;
        const endCutoff = getCutoffDayForDate(currentDate);
        document.getElementById('salaryPeriodText').innerText = `정산기간: ${pStartStr} ~ ${pEndStr} (정산일:${endCutoff}일)`;

        const grid = document.getElementById('calendarGrid');
        while (grid.children.length > 7) {
            grid.removeChild(grid.lastChild);
        }

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        const prevLastDate = new Date(year, month, 0).getDate();

        for (let i = firstDay - 1; i >= 0; i--) {
            createCell(new Date(year, month - 1, prevLastDate - i), true);
        }

        for (let d = 1; d <= lastDate; d++) {
            createCell(new Date(year, month, d), false);
        }

        const totalCells = (firstDay + lastDate) > 35 ? 42 : 35;
        const remaining = totalCells - (firstDay + lastDate);
        for (let i = 1; i <= remaining; i++) {
            createCell(new Date(year, month + 1, i), true);
        }

        calculateSalaryForMonth(year, month);
    }

    function createCell(date, isOtherMonth) {
        const grid = document.getElementById('calendarGrid');
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (isOtherMonth) cell.classList.add('other-month');

        const dateKey = formatDateKey(date);
        if (date.toDateString() === BASE_DATE.toDateString()) {
            cell.classList.add('today');
        }

        const shift = getShiftInfo(date, currentTeam);
        cell.classList.add(`shift-${shift}`);

        const eventData = eventsData[dateKey] || {};

        if (eventData.color) {
            cell.style.backgroundColor = eventData.color;
            if (['#FF2D55', '#FF9500', '#32D74B', '#5AC8FA', '#FF375F'].includes(eventData.color)) {
                cell.style.color = '#ffffff';
            }
        } else if (eventData.leave) {
            cell.style.backgroundColor = 'var(--color-leave)';
            cell.style.color = '#ffffff';
        } else if (eventData.work === '주간대근') {
            cell.style.backgroundColor = 'var(--color-work-day)';
            cell.style.color = '#ffffff';
        } else if (eventData.work === '야간대근') {
            cell.style.backgroundColor = 'var(--color-work-night)';
            cell.style.color = '#ffffff';
        }

        const dayNum = date.getDate();
        const dayOfWeek = date.getDay();
        let numClass = dayOfWeek === 0 ? 'sun' : (dayOfWeek === 6 ? 'sat' : '');

        let shiftName = shift === 'D' ? '주간' : (shift === 'N' ? '야간' : '휴일');
        let statusText = eventData.leave || eventData.work || '';
        let statusBadge = statusText ? `<div class="status-badge">${statusText}</div>` : '';

        cell.innerHTML = `
            <div class="cell-header">
                <span class="day-number ${numClass}">${dayNum}</span>
                <span class="shift-tag">${shiftName}</span>
            </div>
            ${statusBadge}
            <div class="cell-memo">${escapeHtml(eventData.memo || '')}</div>
        `;

        cell.onclick = () => openEditModal(dateKey, date, eventData);
        grid.appendChild(cell);
    }

    // ===== 총 급여 연동 세금 자동 계산식 =====
    function calculateTaxes(taxablePay, totalPay) {
        let taxableBase = taxablePay - 200000; 
        if (taxableBase < 0) taxableBase = 0;

        let incomeTax = Math.round(taxableBase * 0.14488); 
        let residentTax = Math.round(incomeTax * 0.1);

        return { incomeTax, residentTax };
    }

    function calculateSalaryForMonth(year, month) {
        let nightHours = 0;   
        let holidayHours = 0; 

        // 1. 야간 근무일(N)은 현재 보고 있는 달력 월 (1일 ~ 말일) 기준 엄격 집계
        const monthStart = new Date(year, month, 1, 0, 0, 0, 0);
        const monthEnd = new Date(year, month + 1, 0, 23, 59, 59, 999);

        let currN = new Date(monthStart.getTime());
        while (currN <= monthEnd) {
            const dateKey = formatDateKey(currN);
            const shift = getShiftInfo(currN, currentTeam);
            const event = eventsData[dateKey] || {};

            if (shift === 'N') {
                if (!event.leave) {
                    nightHours += 8;
                }
            }
            currN.setDate(currN.getDate() + 1);
        }

        // 2. 대근 및 휴가는 설정된 정산 기간 (Cutoff Period) 기준 집계
        const period = getSalaryPeriod(currentDate);
        let currW = new Date(period.startDate.getTime());
        while (currW <= period.endDate) {
            const dateKey = formatDateKey(currW);
            const event = eventsData[dateKey] || {};

            if (event.work === '주간대근') {
                holidayHours += 12;
                nightHours += 4; 
            } else if (event.work === '야간대근') {
                holidayHours += 12;
                nightHours += 12; 
            }

            currW.setDate(currW.getDate() + 1);
        }

        const nightPay = Math.round(nightHours * 0.5 * HOURLY_RATE);
        const holidayPay = Math.round(holidayHours * 1.5 * HOURLY_RATE);
        const variablePay = nightPay + holidayPay;

        const totalPay = Math.round(FIXED_PAY_SUM + variablePay);

        // 세금 자동 연동 계산 (식대 비과세 140,000원 제외한 과세 대상 금액 기준)
        const taxablePay = totalPay - FIXED_EARNINGS['식대'];
        const { incomeTax, residentTax } = calculateTaxes(taxablePay, totalPay);

        const totalDeduction = FIXED_DEDUCTION_BASE + incomeTax + residentTax;
        const netPay = totalPay - totalDeduction;

        lastCalculatedData = {
            nightHours,
            holidayHours,
            nightPay,
            holidayPay,
            fixedOtPay: 236215,
            totalPay,
            incomeTax,
            residentTax,
            totalDeduction,
            netPay,
            periodStr: `${period.startDate.getFullYear()}.${period.startDate.getMonth()+1}.${period.startDate.getDate()} ~ ${period.endDate.getFullYear()}.${period.endDate.getMonth()+1}.${period.endDate.getDate()}`
        };

        document.getElementById('totalPay').innerText = `₩${totalPay.toLocaleString()}`;
        document.getElementById('deductionPay').innerText = `₩${totalDeduction.toLocaleString()}`;
        document.getElementById('netPay').innerText = `₩${netPay.toLocaleString()}`;
    }

    function formatDateKey(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function changeMonth(diff) {
        currentDate.setMonth(currentDate.getMonth() + diff);
        initCutoffSelect();
        renderCalendar();
    }

    function openTeamModal() {
        document.getElementById('teamModal').classList.add('active');
        document.querySelectorAll('.team-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.innerText.startsWith(currentTeam));
        });
    }

    function closeTeamModal() {
        document.getElementById('teamModal').classList.remove('active');
    }

    function selectTeam(team) {
        currentTeam = team;
        localStorage.setItem('shift_team', team);
        updateTeamDisplay();
        closeTeamModal();
        renderCalendar();
    }

    function openPeriodModal() {
        const mName = `${currentDate.getFullYear()}년 ${currentDate.getMonth()+1}월`;
        document.getElementById('periodModalTitle').innerText = `${mName} 급여 정산일 변경`;
        document.getElementById('periodModalLabel').innerText = `${mName} 정산 마감일 (기본: 25일)`;
        initCutoffSelect();
        document.getElementById('periodModal').classList.add('active');
    }

    function closePeriodModal() {
        document.getElementById('periodModal').classList.remove('active');
    }

    function saveCutoffDay() {
        const select = document.getElementById('cutoffDaySelect');
        const newCutoff = parseInt(select.value, 10);
        const monthKey = getMonthKey(currentDate);
        
        cutoffDaysMap[monthKey] = newCutoff;
        localStorage.setItem('shift_cutoff_map', JSON.stringify(cutoffDaysMap));
        
        closePeriodModal();
        renderCalendar();
    }

    function openSalaryDetailModal() {
        const d = lastCalculatedData;
        const content = document.getElementById('salaryDetailContent');
        
        let html = `
            <div style="font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-bottom: 4px;">정산기간: ${d.periodStr}</div>
            
            <div class="section-title">📦 지급 내역 (통상시급2: 19,685원 적용)</div>
            <table class="salary-table">
                <tr><th>항목</th><th>시간/내용</th><th>금액</th></tr>
        `;

        for (let [item, val] of Object.entries(FIXED_EARNINGS)) {
            if (!item.includes('연장근무수당')) {
                html += `<tr><td>${item}</td><td>고정</td><td class="num">₩${val.toLocaleString()}</td></tr>`;
            }
        }

        html += `<tr><td>휴일근무수당</td><td>${d.holidayHours}시간 (1.5x)</td><td class="num">₩${d.holidayPay.toLocaleString()}</td></tr>`;
        html += `<tr><td>야간근무수당</td><td>${d.nightHours}시간 (0.5x)</td><td class="num">₩${d.nightPay.toLocaleString()}</td></tr>`;
        html += `<tr><td>연장근무수당</td><td>고정 8시간</td><td class="num">₩${d.fixedOtPay.toLocaleString()}</td></tr>`;

        html += `
                <tr style="font-weight:700; background:#f8fafc;"><td colspan="2">총 지급액</td><td class="num" style="color:#2563eb;">₩${d.totalPay.toLocaleString()}</td></tr>
            </table>

            <div class="section-title">📉 공제 내역 (세금 총급여 연동)</div>
            <table class="salary-table">
                <tr><th>항목</th><th>금액</th></tr>
        `;

        for (let [item, val] of Object.entries(FIXED_DEDUCTIONS)) {
            html += `<tr><td>${item}</td><td class="num">₩${val.toLocaleString()}</td></tr>`;
        }
        html += `<tr><td>소득세 (연동)</td><td class="num">₩${d.incomeTax.toLocaleString()}</td></tr>`;
        html += `<tr><td>주민세 (연동)</td><td class="num">₩${d.residentTax.toLocaleString()}</td></tr>`;

        html += `
                <tr style="font-weight:700; background:#f8fafc;"><td>공제 합계</td><td class="num" style="color:#ef4444;">₩${d.totalDeduction.toLocaleString()}</td></tr>
            </table>

            <div style="background:#eff6ff; padding:10px; border-radius:8px; text-align:center; margin-top:4px;">
                <span style="font-size:0.8rem; font-weight:700; color:#1e293b;">실 지급액: </span>
                <span style="font-size:1.1rem; font-weight:800; color:#16a34a;">₩${d.netPay.toLocaleString()}</span>
            </div>
        `;

        content.innerHTML = html;
        document.getElementById('salaryDetailModal').classList.add('active');
    }

    function closeSalaryDetailModal() {
        document.getElementById('salaryDetailModal').classList.remove('active');
    }

    function openEditModal(dateKey, date, data) {
        selectedDateKey = dateKey;
        document.getElementById('modalDateTitle').innerText = `${date.getMonth()+1}월 ${date.getDate()}일 일정 편집`;

        tempLeave = data.leave || '';
        tempWork = data.work || '';
        tempColor = data.color || '';
        document.getElementById('memoInput').value = data.memo || '';

        updateOptionUI();
        document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
    }

    function toggleOption(type, value) {
        if (type === 'leave') {
            tempLeave = (tempLeave === value) ? '' : value;
            if (tempLeave) tempWork = '';
        } else {
            tempWork = (tempWork === value) ? '' : value;
            if (tempWork) tempLeave = '';
        }
        updateOptionUI();
    }

    function selectColor(color) {
        tempColor = color;
        updateOptionUI();
    }

    function updateOptionUI() {
        document.querySelectorAll('#leaveGroup .opt-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === tempLeave);
        });
        document.querySelectorAll('#workGroup .opt-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === tempWork);
        });
        document.querySelectorAll('.color-circle').forEach(circle => {
            circle.classList.toggle('selected', tempColor !== '' && circle.getAttribute('onclick').includes(tempColor));
        });
    }

    function saveEvent() {
        const memo = document.getElementById('memoInput').value;

        if (!tempLeave && !tempWork && !tempColor && !memo.trim()) {
            delete eventsData[selectedDateKey];
        } else {
            eventsData[selectedDateKey] = { leave: tempLeave, work: tempWork, color: tempColor, memo: memo };
        }

        localStorage.setItem('shift_events', JSON.stringify(eventsData));
        closeEditModal();
        renderCalendar();
    }

    function deleteEvent() {
        if (eventsData[selectedDateKey]) {
            delete eventsData[selectedDateKey];
            localStorage.setItem('shift_events', JSON.stringify(eventsData));
        }
        closeEditModal();
        renderCalendar();
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installBtn').style.display = 'block';
    });

    function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
        } else {
            alert('크롬 메뉴(⋮)에서 "앱 설치" 또는 "홈 화면에 추가"를 눌러주세요.');
        }
    }
</script>
